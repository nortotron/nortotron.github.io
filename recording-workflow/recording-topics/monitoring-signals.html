 UI Emoji" font-size="20px" fill="#1e1e1e" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">For each track in Pro Tools, set the output and adhere to the same numbering convention.</text></g><g transform="translate(10 230) rotate(0 348.4495544433594 12.5)"><text x="0" y="19.08" font-family="Nunito, sans-serif, Segoe UI Emoji" font-size="20px" fill="#1e1e1e" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">Route the track output in sequence across the desk (There is a key command)</text></g><g transform="translate(10 350) rotate(0 237.0596923828125 12.5)"><text x="0" y="19.08" font-family="Nunito, sans-serif, Segoe UI Emoji" font-size="20px" fill="#1e1e1e" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">Activate the 'Mix' button on the relevant Long Fader </text></g><g transform="translate(10 290) rotate(0 367.67950439453125 12.5)"><text x="0" y="19.08" font-family="Nunito, sans-serif, Segoe UI Emoji" font-size="20px" fill="#1e1e1e" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">Remove each source Short Fader (SF) from the mix bus so that you cannot hear it.</text></g><g transform="translate(10 410) rotate(0 160.5797882080078 12.5)"><text x="0" y="19.08" font-family="Nunito, sans-serif, Segoe UI Emoji" font-size="20px" fill="#1e1e1e" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">Raise the Long Fader to 'unity' 0 dB</text></g><g transform="translate(10 450) rotate(0 298.2596435546875 12.5)"><text x="0" y="19.08" font-family="Nunito, sans-serif, Segoe UI Emoji" font-size="20px" fill="#1e1e1e" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">Hear the signal returning from Protools on the Mix / Control Room</text></g><g transform="translate(10 510) rotate(0 388.0395202636719 12.5)"><text x="0" y="19.08" fo
